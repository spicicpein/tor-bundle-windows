name: build-windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build tor-bundle-windows.exe
        id: build
        env:
          GOPROXY: direct
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: |
          set +e
          go build -v -o tor-bundle-windows.exe . > build-output.log 2>&1
          echo "buildexit=$?" >> "$GITHUB_OUTPUT"
          tail -c 60000 build-output.log > build-output-tail.log
          cat build-output-tail.log

      - name: Publish log on failure
        if: steps.build.outputs.buildexit != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
import base64, json, os, urllib.request

repo = os.environ["GITHUB_REPOSITORY"]
token = os.environ["GH_TOKEN"]
sha = os.environ["GITHUB_SHA"]
with open("build-output-tail.log", "rb") as f:
    content = f.read()

url = f"https://api.github.com/repos/{repo}/contents/last-build-error.log"
req = urllib.request.Request(url, headers={"Authorization": f"token {token}"})
sha_existing = None
try:
    with urllib.request.urlopen(req) as resp:
        sha_existing = json.load(resp)["sha"]
except Exception:
    pass

payload = {
    "message": f"CI build error log for {sha}",
    "content": base64.b64encode(content).decode(),
    "branch": "main",
}
if sha_existing:
    payload["sha"] = sha_existing

req2 = urllib.request.Request(
    url,
    data=json.dumps(payload).encode(),
    headers={"Authorization": f"token {token}", "Content-Type": "application/json"},
    method="PUT",
)
with urllib.request.urlopen(req2) as resp:
    print(resp.status)
PYEOF

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.buildexit == '0'
        with:
          name: tor-bundle-windows
          path: tor-bundle-windows.exe
          retention-days: 30
