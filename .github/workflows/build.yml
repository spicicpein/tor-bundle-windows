name: build-windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Fetch official pluggable transport binaries
        run: |
          set -e
          curl -sL -o expert-bundle.tar.gz \
            "https://archive.torproject.org/tor-package-archive/torbrowser/15.0.8/tor-expert-bundle-windows-x86_64-15.0.8.tar.gz"
          mkdir -p bundle-extract
          tar -xzf expert-bundle.tar.gz -C bundle-extract
          echo "=== full bundle listing ===" > bundle-listing.log
          find bundle-extract -type f >> bundle-listing.log
          cat bundle-listing.log
          mkdir -p embedded
          find bundle-extract -iname "lyrebird.exe" -exec cp {} embedded/lyrebird.exe \;
          find bundle-extract -iname "snowflake-client.exe" -exec cp {} embedded/snowflake-client.exe \;
          ls -la embedded/ >> bundle-listing.log || true

      - name: Publish bundle listing
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/publish_log.py bundle-listing.log last-bundle-listing.log

      - name: Build tor-bundle-windows.exe
        id: build
        env:
          GOPROXY: direct
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: |
          set +e
          go build -v -o tor-bundle-windows.exe . > build-output.log 2>&1
          echo "buildexit=$?" >> "$GITHUB_OUTPUT"
          tail -c 60000 build-output.log > build-output-tail.log
          cat build-output-tail.log

      - name: Publish log on failure
        if: steps.build.outputs.buildexit != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/publish_log.py

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.buildexit == '0'
        with:
          name: tor-bundle-windows
          path: tor-bundle-windows.exe
          retention-days: 30

      - name: Publish release
        if: steps.build.outputs.buildexit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tor-bundle-windows.exe \
            --title "Latest build" \
            --notes "Automatic build from commit ${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}"
