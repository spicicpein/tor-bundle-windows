name: build-windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build tor-bundle-windows.exe
        env:
          GOPROXY: direct
          GOSUMDB: "off"
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: |
          go build -v -o tor-bundle-windows.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: tor-bundle-windows
          path: tor-bundle-windows.exe
          retention-days: 30
